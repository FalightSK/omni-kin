<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Dataset Collector - LeRobot Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 12px #6366f1;
        }

        h1 {
            font-size: 1.05rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        /* SSL Warning Banner */
        .ssl-banner {
            display: none;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #111827;
            padding: 10px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            z-index: 20;
        }

        .ssl-banner a {
            color: #000;
            text-decoration: underline;
            font-weight: 700;
            margin-left: 6px;
        }

        /* Camera Viewport */
        .viewport-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlays */
        .hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            opacity: 0.3;
        }

        .rec-dot.active {
            opacity: 1;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.3; }
            to { opacity: 1; box-shadow: 0 0 10px #ef4444; }
        }

        /* Permission Prompt Overlay */
        .permission-card {
            position: absolute;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 15;
        }

        .permission-card h3 {
            font-size: 1rem;
            color: #e0e7ff;
        }

        .permission-card p {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .btn-grant {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Controls Section */
        .controls-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 18px 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            font-weight: 600;
        }

        .instruction-wrapper {
            display: flex;
            gap: 8px;
        }

        select, input[type="text"] {
            flex: 1;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        .rec-button {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }

        .rec-button.recording {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            box-shadow: 0 4px 20px rgba(71, 85, 105, 0.4);
        }

        .status-banner {
            font-size: 0.78rem;
            text-align: center;
            color: #94a3b8;
        }

        /* Native File Capture */
        .native-capture-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="ssl-banner" id="sslBanner">
        🔒 Mobile Camera requires HTTPS. <a id="httpsLink" href="#">Switch to HTTPS</a>
    </div>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            <h1>LeRobot Collector</h1>
        </div>
        <div class="badge">SO-100</div>
    </header>

    <div class="viewport-container">
        <video id="cameraPreview" autoplay playsinline muted></video>

        <!-- Permission Prompt (if camera not started yet) -->
        <div class="permission-card" id="permCard">
            <h3>📷 Camera & Sensor Access</h3>
            <p>Tap below to start the camera and high-frequency motion tracking.</p>
            <button class="btn-grant" id="grantBtn">START CAMERA</button>
        </div>
        
        <div class="hud-overlay">
            <div class="hud-card">
                <div class="rec-dot" id="recDot"></div>
                <span id="recTime">00:00.0</span>
            </div>
            <div class="hud-card">
                <span>IMU: <strong id="imuHz">0</strong> Hz</span>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="input-group">
            <label for="taskInstruction">Task Instruction</label>
            <div class="instruction-wrapper">
                <select id="presetInstruction">
                    <option value="reach to apple">reach to apple</option>
                    <option value="reach to banana">reach to banana</option>
                    <option value="pick up cup">pick up cup</option>
                    <option value="custom">Custom...</option>
                </select>
                <input type="text" id="customInstruction" placeholder="Enter task..." style="display: none;">
            </div>
        </div>

        <button class="rec-button" id="recordBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="8"/>
            </svg>
            <span id="btnText">START RECORDING</span>
        </button>

        <label class="native-capture-btn">
            <span>📷 Or Record with Native Camera App</span>
            <input type="file" id="nativeVideoInput" accept="video/*" capture="environment" style="display: none;">
        </label>

        <div class="status-banner" id="statusText">Ready to capture demonstration</div>
    </div>

    <script>
        const cameraPreview = document.getElementById('cameraPreview');
        const permCard = document.getElementById('permCard');
        const grantBtn = document.getElementById('grantBtn');
        const recordBtn = document.getElementById('recordBtn');
        const btnText = document.getElementById('btnText');
        const recDot = document.getElementById('recDot');
        const recTime = document.getElementById('recTime');
        const imuHz = document.getElementById('imuHz');
        const statusText = document.getElementById('statusText');
        const presetInstruction = document.getElementById('presetInstruction');
        const customInstruction = document.getElementById('customInstruction');
        const nativeVideoInput = document.getElementById('nativeVideoInput');
        const sslBanner = document.getElementById('sslBanner');
        const httpsLink = document.getElementById('httpsLink');

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let startTime = 0;
        let timerInterval = null;

        let imuData = [];
        let imuCount = 0;
        let imuRateInterval = null;

        // Check if accessed over HTTP on mobile
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            sslBanner.style.display = 'block';
            httpsLink.href = 'https://' + location.hostname + ':8000' + location.pathname;
        }

        // Custom instruction toggle
        presetInstruction.addEventListener('change', (e) => {
            customInstruction.style.display = e.target.value === 'custom' ? 'block' : 'none';
        });

        // Initialize Camera
        async function startCamera() {
            try {
                // Request iOS 13+ motion permission if available
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const perm = await DeviceMotionEvent.requestPermission();
                        console.log("DeviceMotion permission:", perm);
                    } catch (e) {
                        console.log("Motion permission notice:", e);
                    }
                }

                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraPreview.srcObject = stream;
                cameraPreview.play();
                permCard.style.display = 'none';
                statusText.innerText = "Camera active & ready to record.";
                initIMU();
            } catch (err) {
                console.error("Camera error:", err);
                statusText.innerText = "Camera error: " + (err.message || err.name);
                if (location.protocol !== 'https:') {
                    statusText.innerText = "⚠️ Please use HTTPS for mobile camera access!";
                    sslBanner.style.display = 'block';
                }
            }
        }

        grantBtn.addEventListener('click', startCamera);

        // Initialize IMU listeners
        function initIMU() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', (event) => {
                    imuCount++;
                    if (!isRecording) return;
                    
                    const acc = event.accelerationIncludingGravity || { x: 0, y: 0, z: 9.81 };
                    const rot = event.rotationRate || { alpha: 0, beta: 0, gamma: 0 };
                    
                    imuData.push({
                        timestamp: (Date.now() - startTime) / 1000.0,
                        accel: [acc.x || 0, acc.y || 0, acc.z || 9.81],
                        gyro: [rot.alpha || 0, rot.beta || 0, rot.gamma || 0]
                    });
                });
            }

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    if (!isRecording || imuData.length === 0) return;
                    const lastIdx = imuData.length - 1;
                    imuData[lastIdx].orientation = [event.alpha || 0, event.beta || 0, event.gamma || 0];
                });
            }

            if (!imuRateInterval) {
                imuRateInterval = setInterval(() => {
                    imuHz.innerText = imuCount;
                    imuCount = 0;
                }, 1000);
            }
        }

        // Recording logic
        recordBtn.addEventListener('click', async () => {
            if (!cameraPreview.srcObject) {
                await startCamera();
                return;
            }
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            const stream = cameraPreview.srcObject;
            if (!stream) return;

            recordedChunks = [];
            imuData = [];
            isRecording = true;
            startTime = Date.now();

            let options = { mimeType: 'video/webm' };
            if (!MediaRecorder.isTypeSupported('video/webm')) {
                if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4' };
                } else {
                    options = {};
                }
            }

            mediaRecorder = new MediaRecorder(stream, options);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.start(30);

            recDot.classList.add('active');
            recordBtn.classList.add('recording');
            btnText.innerText = "STOP RECORDING";
            statusText.innerText = "Recording demonstration trajectory...";

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000.0;
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toFixed(1).padStart(4, '0');
                recTime.innerText = `${mins}:${secs}`;
            }, 100);
        }

        async function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);

            recDot.classList.remove('active');
            recordBtn.classList.remove('recording');
            btnText.innerText = "SAVING...";
            statusText.innerText = "Processing trajectory...";

            mediaRecorder.stop();

            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: recordedChunks[0]?.type || 'video/webm' });
                await uploadRecording(blob, imuData);
                btnText.innerText = "START RECORDING";
            };
        }

        // Native Video File Capture Fallback
        nativeVideoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Uploading native video recording...";
            await uploadRecording(file, []);
        });

        async function uploadRecording(videoBlob, imuList) {
            const task = presetInstruction.value === 'custom' ? customInstruction.value : presetInstruction.value;

            const formData = new FormData();
            formData.append('video', videoBlob, 'recording.mp4');
            formData.append('imu_data', JSON.stringify(imuList));
            formData.append('task', task);

            try {
                const response = await fetch('/api/recordings/save', {
                    method: 'POST',
                    body: formData
                });
                const res = await response.json();
                if (res.status === 'success') {
                    statusText.innerText = `✅ Saved Episode #${res.episode_index}! Task: "${res.task}"`;
                } else {
                    statusText.innerText = "Error saving recording.";
                }
            } catch (err) {
                console.error("Upload error:", err);
                statusText.innerText = "Upload failed: " + err.message;
            }
        }

        window.onload = () => {
            initIMU();
            // Try auto-starting if secure
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startCamera();
            }
        };
    </script>
</body>
</html>
