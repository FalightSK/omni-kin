<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Dataset Collector - LeRobot Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 12px #6366f1;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            font-weight: 600;
        }

        select, input[type="text"] {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
        }

        /* Big Record Button */
        .record-trigger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 22px 18px;
            border-radius: 18px;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .record-trigger:active {
            transform: scale(0.98);
        }

        .record-trigger svg {
            width: 36px;
            height: 36px;
        }

        .record-trigger span {
            font-size: 1.1rem;
        }

        .record-trigger small {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 400;
        }

        /* Status card */
        .status-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-title {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .status-msg {
            font-size: 1rem;
            font-weight: 600;
            color: #e0e7ff;
        }

        .hud-stats {
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.8rem;
            color: #64748b;
        }

        .hud-stats strong {
            color: #a5b4fc;
        }

        /* Live Viewport (if active) */
        #videoPreview {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 14px;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            <h1>LeRobot Collector</h1>
        </div>
        <div class="badge">SO-100 Arm</div>
    </header>

    <div class="card">
        <div class="input-group">
            <label for="presetInstruction">Task Instruction</label>
            <select id="presetInstruction">
                <option value="reach to apple">reach to apple</option>
                <option value="reach to banana">reach to banana</option>
                <option value="pick up cup">pick up cup</option>
                <option value="custom">Custom Instruction...</option>
            </select>
            <input type="text" id="customInstruction" placeholder="e.g. push red cube forward" style="display: none; margin-top: 8px;">
        </div>

        <video id="videoPreview" autoplay playsinline muted></video>

        <!-- Native Camera Record Trigger (Works 100% on HTTP and HTTPS) -->
        <label class="record-trigger" id="recordTrigger">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="9"/>
            </svg>
            <span id="recordLabel">RECORD DEMONSTRATION</span>
            <small id="recordSub">Tap to open phone camera & capture motion</small>
            <input type="file" id="cameraFileInput" accept="video/*" capture="environment" style="display: none;">
        </label>
    </div>

    <div class="status-card">
        <div class="status-title">Status</div>
        <div class="status-msg" id="statusMsg">Ready to record demonstration</div>
        <div class="hud-stats">
            <span>Protocol: <strong id="protocolText">HTTP</strong></span>
            <span>Target: <strong>SO-100 IK</strong></span>
        </div>
    </div>

    <script>
        const cameraFileInput = document.getElementById('cameraFileInput');
        const recordLabel = document.getElementById('recordLabel');
        const recordSub = document.getElementById('recordSub');
        const statusMsg = document.getElementById('statusMsg');
        const presetInstruction = document.getElementById('presetInstruction');
        const customInstruction = document.getElementById('customInstruction');
        const protocolText = document.getElementById('protocolText');
        const videoPreview = document.getElementById('videoPreview');

        protocolText.innerText = window.location.protocol.replace(':', '').toUpperCase();

        let imuData = [];
        let startTime = Date.now();

        // Custom instruction toggle
        presetInstruction.addEventListener('change', (e) => {
            customInstruction.style.display = e.target.value === 'custom' ? 'block' : 'none';
        });

        // Initialize background IMU listeners if available
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity || { x: 0, y: 0, z: 9.81 };
                const rot = event.rotationRate || { alpha: 0, beta: 0, gamma: 0 };
                
                imuData.push({
                    timestamp: (Date.now() - startTime) / 1000.0,
                    accel: [acc.x || 0, acc.y || 0, acc.z || 9.81],
                    gyro: [rot.alpha || 0, rot.beta || 0, rot.gamma || 0]
                });
            });
        }

        // When user records video with phone camera
        cameraFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            recordLabel.innerText = "UPLOADING & PROCESSING...";
            recordSub.innerText = "Calculating 6-DoF trajectory & SO-100 IK...";
            statusMsg.innerText = `Uploading video (${(file.size / (1024*1024)).toFixed(2)} MB)...`;

            const task = presetInstruction.value === 'custom' ? customInstruction.value : presetInstruction.value;

            const formData = new FormData();
            formData.append('video', file, file.name || 'recording.mp4');
            formData.append('imu_data', JSON.stringify(imuData.slice(-150)));
            formData.append('task', task);

            try {
                const response = await fetch('/api/recordings/save', {
                    method: 'POST',
                    body: formData
                });
                const res = await response.json();
                if (res.status === 'success') {
                    statusMsg.innerText = `🎉 Saved Episode #${res.episode_index} (${res.num_frames} frames)!`;
                    recordLabel.innerText = "RECORD ANOTHER";
                    recordSub.innerText = "Tap to record next demonstration";
                } else {
                    statusMsg.innerText = "Error processing recording.";
                    recordLabel.innerText = "RECORD DEMONSTRATION";
                }
            } catch (err) {
                console.error("Upload error:", err);
                statusMsg.innerText = "Upload failed: " + err.message;
                recordLabel.innerText = "RECORD DEMONSTRATION";
            }
        });
    </script>
</body>
</html>
