<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeRobot Mobile Trajectory Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 14px;
            height: 14px;
            background: #6366f1;
            border-radius: 4px;
            transform: rotate(45deg);
            box-shadow: 0 0 16px #6366f1;
        }

        .mobile-url-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        /* Main Grid Layout */
        .container {
            flex: 1;
            padding: 24px 32px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        /* Cards */
        .card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 3D Canvas */
        #canvas3d {
            width: 100%;
            height: 380px;
            border-radius: 14px;
            overflow: hidden;
            background: #050811;
        }

        /* Episode List */
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .episode-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            cursor: pointer;
        }

        .episode-item:hover, .episode-item.selected {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .ep-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ep-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f8fafc;
        }

        .ep-task {
            font-size: 0.8rem;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .ep-meta {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Modal / Stats Panel */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 700;
            color: #818cf8;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <div class="logo-icon"></div>
            LeRobot Mobile Collector
        </div>

        <div class="mobile-url-card">
            <span>📱 Mobile App URL:</span>
            <strong id="mobileUrlText">http://<span id="localIp">localhost</span>:8000/mobile</strong>
        </div>

        <div class="nav-actions">
            <button class="btn" id="addSampleBtn">⚡ Generate Sample Recording</button>
            <button class="btn" id="isaacBtn" style="border-color: #818cf8; color: #a5b4fc;">🎮 Replay in Isaac Lab</button>
            <button class="btn btn-primary" id="exportBtn">📦 Export LeRobot Dataset</button>
        </div>
    </nav>

    <div class="container">
        <!-- Left: 3D Visualization & Video Player -->
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        3D Trajectory & SO-100 Kinematics Preview
                    </div>
                    <span style="font-size: 0.8rem; color: #94a3b8;" id="activeEpText">No episode selected</span>
                </div>
                <div id="canvas3d"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                        Camera Stream Recording
                    </div>
                </div>
                <video id="episodeVideo" controls style="width: 100%; height: 240px; background: #000; border-radius: 12px;"></video>
            </div>
        </div>

        <!-- Right: Episode Manager & Export Panel -->
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Dataset Summary</div>
                </div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="totalEpisodes">0</div>
                        <div class="stat-lbl">Total Episodes</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="totalFrames">0</div>
                        <div class="stat-lbl">Total Frames</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val">SO-100</div>
                        <div class="stat-lbl">Embodiment</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val">v3.0</div>
                        <div class="stat-lbl">LeRobot Schema</div>
                    </div>
                </div>
            </div>

            <div class="card" style="flex: 1;">
                <div class="card-header">
                    <div class="card-title">Episodes List</div>
                    <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;" id="refreshBtn">Refresh</button>
                </div>
                <div class="episode-list" id="epList">
                    <!-- Dynamic episode items -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set local IP text
        document.getElementById('mobileUrlText').innerText = `http://${window.location.hostname}:8000/mobile`;

        let episodes = [];
        let selectedEpIdx = -1;

        // Three.js 3D Viewport Setup
        const canvasContainer = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050811);

        const camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 100);
        camera.position.set(0.6, 0.5, 0.6);
        camera.lookAt(0, 0.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Lighting & Grid
        const grid = new THREE.GridHelper(1.0, 20, 0x334155, 0x1e293b);
        scene.add(grid);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x818cf8, 0.8);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // Robot Arm Base Mesh (SO-100 Base)
        const baseGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.04, 16);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const robotBase = new THREE.Mesh(baseGeo, baseMat);
        robotBase.position.set(0, 0.02, 0);
        scene.add(robotBase);

        // Trajectory Line Mesh
        let trajLine = null;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Fetch Episodes from API
        async function fetchEpisodes() {
            try {
                const res = await fetch('/api/episodes');
                episodes = await res.json();
                renderEpisodes();
            } catch (err) {
                console.error("Error loading episodes:", err);
            }
        }

        function renderEpisodes() {
            const epList = document.getElementById('epList');
            const totalEpisodes = document.getElementById('totalEpisodes');
            const totalFrames = document.getElementById('totalFrames');

            epList.innerHTML = '';
            totalEpisodes.innerText = episodes.length;

            let framesCount = 0;

            episodes.forEach((ep, idx) => {
                framesCount += ep.num_frames || 0;

                const item = document.createElement('div');
                item.className = `episode-item ${idx === selectedEpIdx ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="ep-info">
                        <div class="ep-title">Episode #${ep.episode_index}</div>
                        <div class="ep-task">${ep.task}</div>
                        <div class="ep-meta">${ep.num_frames} frames • ${ep.created_at || 'Just now'}</div>
                    </div>
                    <div style="font-size: 1.2rem; color: #818cf8;">➔</div>
                `;
                item.onclick = () => selectEpisode(idx);
                epList.appendChild(item);
            });

            totalFrames.innerText = framesCount;
        }

        function selectEpisode(idx) {
            selectedEpIdx = idx;
            const ep = episodes[idx];
            document.getElementById('activeEpText').innerText = `Episode #${ep.episode_index} - "${ep.task}"`;
            renderEpisodes();

            if (ep.video_url) {
                document.getElementById('episodeVideo').src = ep.video_url;
            }

            // Draw 3D trajectory
            if (ep.poses) {
                if (trajLine) scene.remove(trajLine);

                const points = ep.poses.map(p => new THREE.Vector3(p[0] + 0.2, p[2] + 0.1, p[1]));
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: 0x818cf8, linewidth: 3 });
                trajLine = new THREE.Line(geometry, material);
                scene.add(trajLine);
            }
        }

        // Generate Sample Recording
        document.getElementById('addSampleBtn').onclick = async () => {
            await fetch('/api/recordings/sample', { method: 'POST' });
            fetchEpisodes();
        };

        // Export LeRobot Dataset
        document.getElementById('exportBtn').onclick = async () => {
            const res = await fetch('/api/export_lerobot', { method: 'POST' });
            const data = await res.json();
            alert(`LeRobot Dataset Exported Successfully!\n\nPath: ${data.export_path}\nTotal Episodes: ${data.total_episodes}`);
        };

        // Replay in Isaac Lab
        document.getElementById('isaacBtn').onclick = async () => {
            const epIdx = selectedEpIdx >= 0 ? selectedEpIdx : 0;
            const res = await fetch(`/api/isaac_lab/replay?episode_index=${epIdx}`, { method: 'POST' });
            const data = await res.json();
            if (data.status === 'success') {
                alert(`🚀 Launching Isaac Lab Simulation Replay!\n\n${data.message}`);
            } else {
                alert(`Error: ${data.message}`);
            }
        };

        document.getElementById('refreshBtn').onclick = fetchEpisodes;
        window.onload = fetchEpisodes;
    </script>
</body>
</html>
